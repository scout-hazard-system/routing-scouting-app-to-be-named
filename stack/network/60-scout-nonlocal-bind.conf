# /etc/sysctl.d/60-scout-nonlocal-bind.conf
# nginx binds some listeners to interface addresses (netboot: 192.168.1.100:80 on eno1).
# Allow that before the link is up: without it, one missing address (e.g. the Ethernet cable
# unseated at boot) fails nginx -t and takes down the public gate, TLS edge and netboot.
net.ipv4.ip_nonlocal_bind = 1
net.ipv6.ip_nonlocal_bind = 1
