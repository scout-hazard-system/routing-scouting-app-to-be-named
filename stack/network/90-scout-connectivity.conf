# /etc/NetworkManager/conf.d/90-scout-connectivity.conf
# Ethernet (eno1, via the EdgeRouter) is the primary default route (metric 100) and wifi the
# backup (600). Carrier alone does not mean internet: with connectivity checks on, a link that
# fails the check gets its default route penalised (+20000) and the other link takes over.
# Tested: EdgeRouter path blocked -> wifi carried traffic in ~40 s, site stayed up; Ethernet
# primary again ~10 s after the path returned.
[connectivity]
enabled=true
uri=http://cp.cloudflare.com/generate_204
response=
interval=30
