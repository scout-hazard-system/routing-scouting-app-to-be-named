# Scout edge — nginx TLS termination on the Dell (Debian: /etc/nginx/conf.d/).
#
#   :443   Imagoro command center (static :8790) + imagoro serve API (:19020)
#   :8443  Scout map/route backend (Java, :18080) for Android + LAN tools
#
# Upstreams should bind 127.0.0.1 once nginx is in front (IMAGORO_SERVE_HOST,
# backend bind host). nginx injects the upstream credentials from
# /etc/nginx/scout-secrets.conf (root:www-data 640, never committed), so only
# clients that pass the allowlist below — and optional client-cert mTLS — can
# use them. Browsers cannot attach a bearer to EventSource; this is the fix.

# --- who may connect at all (mesh, tailnet, loopback, named LAN hosts) -------
geo $scout_client_allowed {
  default          0;
  127.0.0.0/8      1;
  10.66.0.0/16     1;   # Scout WireGuard mesh (scoutwg0)
  100.64.0.0/10    1;   # Tailscale
  192.168.12.0/24  1;   # home LAN: the Windows workstation's DHCP lease rotates, so no /32 pins
}

# Credentials injected toward upstreams (defines $imagoro_serve_token,
# $scout_pull_key). See scout-secrets.conf.example.
include /etc/nginx/scout-secrets.conf;

limit_req_zone  $binary_remote_addr zone=scout_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=scout_conn:10m;

upstream imagoro_ui    { server 127.0.0.1:8790;  keepalive 8; }
upstream imagoro_serve { server 127.0.0.1:19020; keepalive 8; }
upstream scout_backend { server 127.0.0.1:18080; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# Shared TLS settings
ssl_certificate      /etc/nginx/scout-pki/scout-edge.crt;
ssl_certificate_key  /etc/nginx/scout-pki/scout-edge.key;
# ssl_protocols / ssl_prefer_server_ciphers are set per server (Debian's
# stock nginx.conf already defines them at http level).
ssl_session_cache    shared:scout_tls:10m;
ssl_session_timeout  1d;
ssl_session_tickets  off;
# Optional mTLS: uncomment to require a client cert signed by the Scout CA.
# ssl_client_certificate /etc/nginx/scout-pki/ca.crt;
# ssl_verify_client on;

# server_tokens: already off in Debian's nginx.conf

# :80 -> :443 redirect lives in scout-edge-http-redirect.conf; install it only
# once the PXE server no longer owns port 80.

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_protocols TLSv1.2 TLSv1.3;
  if ($scout_client_allowed = 0) { return 403; }
  limit_conn scout_conn 64;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # SSE stream: no buffering, long-lived
  location = /api/pipeline/stream {
    proxy_pass http://imagoro_serve;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "Bearer $imagoro_serve_token";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    limit_req zone=scout_api burst=40 nodelay;
    proxy_pass http://imagoro_serve;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "Bearer $imagoro_serve_token";
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://imagoro_ui;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name _;

  ssl_protocols TLSv1.2 TLSv1.3;
  if ($scout_client_allowed = 0) { return 403; }
  limit_conn scout_conn 64;
  client_max_body_size 2m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  location ~ ^/api/(pipeline|mobile)/stream$ {
    proxy_pass http://scout_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Backend-Api-Key $scout_pull_key;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    limit_req zone=scout_api burst=60 nodelay;
    proxy_pass http://scout_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Backend-Api-Key $scout_pull_key;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
  }
}
