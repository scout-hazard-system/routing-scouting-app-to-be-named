# /etc/nginx/conf.d/scout-netboot.conf — netboot files for the Scout LAN only.
# Bound to the eno1 address; never on the 192.168.12.x (ISP) side. No listing.
server {
  listen 192.168.1.100:80;
  server_name _;
  root /srv/netboot;
  autoindex off;
  server_tokens off;

  allow 192.168.1.0/24;
  allow 127.0.0.1;
  deny  all;

  location ~ /\. { deny all; }
  location ~ \.(bak|orig|swp)$ { deny all; }
  location / { try_files $uri =404; }
}
