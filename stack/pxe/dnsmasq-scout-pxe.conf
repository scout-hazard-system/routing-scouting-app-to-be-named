# /etc/dnsmasq.d/scout-pxe.conf — proxy-DHCP + TFTP for the Scout LAN (eno1).
# Proxy mode: the EdgeRouter (192.168.1.1) still hands out addresses; dnsmasq
# only adds boot info. DNS disabled (port=0).
port=0
interface=eno1
bind-interfaces
dhcp-range=192.168.1.0,proxy,255.255.255.0
log-dhcp

enable-tftp
tftp-root=/srv/pxe
tftp-secure

# Firmware (BIOS/UEFI) PXE -> iPXE binary over TFTP
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
pxe-service=tag:!ipxe,x86PC,"Scout iPXE (BIOS)",undionly.kpxe
pxe-service=tag:!ipxe,X86-64_EFI,"Scout iPXE (UEFI)",ipxe.efi
# Already running iPXE -> hand it the HTTP menu (avoids an endless chain loop)
dhcp-userclass=set:ipxe,iPXE
pxe-service=tag:ipxe,x86PC,"Scout menu",http://192.168.1.100/boot.ipxe
pxe-service=tag:ipxe,X86-64_EFI,"Scout menu",http://192.168.1.100/boot.ipxe
dhcp-boot=tag:ipxe,http://192.168.1.100/boot.ipxe
