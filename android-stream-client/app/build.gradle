plugins {
    id("com.android.application")
}

android {
    namespace "dev.warp.stream"
    compileSdk 34

    defaultConfig {
        applicationId "dev.warp.stream"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    flavorDimensions "appmode"
    productFlavors {
        navigation {
            dimension "appmode"
            resValue "string", "app_name", "Scanner Stream"
            buildConfigField "boolean", "ENABLE_DEV_CONTROLS", "false"
        }
        dev {
            dimension "appmode"
            applicationIdSuffix ".client"
            versionNameSuffix "-client"
            resValue "string", "app_name", "Scanner Stream Client"
            buildConfigField "boolean", "ENABLE_DEV_CONTROLS", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        disable "MissingIntentFilterForMediaSearch", "MissingMediaBrowserServiceIntentFilter"
    }
}

dependencies {
    implementation project(":frontend-ui")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.car.app:app:1.4.0"
}
